# Every push and pull request: one fast job (unit tests, lint, the shrunk release build).
# A release: Actions → build → Run workflow with a version (e.g. v1.5; it makes the tag), or push a
# v* tag. It builds the release, signs it with your key, checks the key's fingerprint, installs it on
# an Android 15 emulator (tools/install-check.sh: adb install, open, service runs), and publishes it.
# The key: Settings → Environments → "release" → secret DEBUG_KEYSTORE_BASE64 (base64 of the
# debug.keystore that signed the app on your phone), so each release installs as an update.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release this commit as (e.g. v1.5); empty = only check'
        required: false
        type: string

# A newer push replaces a running check of the same branch; releases always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && !startsWith(inputs.version, 'v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test :app:lintRelease :app:assembleRelease

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.version, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
      # The public fingerprint of the key that signed the app on the phone (not a secret).
      KEY_SHA256: fb68ad9ab1498f7e2f6cd7665673c4d9761e4c655934332cba3afd91caed7754
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Sign with the key of the app on the phone
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::Add DEBUG_KEYSTORE_BASE64 to the release environment"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - run: ./gradlew test :app:assembleRelease
      - name: Check it is signed with the key of the app on the phone
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signer.txt
          grep -q "SHA-256 digest: $KEY_SHA256" signer.txt || { echo "::error::Signed with another key: check DEBUG_KEYSTORE_BASE64"; exit 1; }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # A real install of exactly this APK before anyone downloads it.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: ./tools/install-check.sh app/build/outputs/apk/release/app-release.apk
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "brainrot-$TAG.apk"
          # Running a version again replaces its release. Makes the tag on this commit if needed.
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" "brainrot-$TAG.apk" --target "$GITHUB_SHA" --generate-notes
