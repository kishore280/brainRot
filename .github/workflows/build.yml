# Every push: the tests and a test APK (the "brainrot-debug" artifact of the run).
# A tag like v1.2: the same, signed with your key, published as a GitHub release you install from.
# The key: Settings → Environments → "release" → secret DEBUG_KEYSTORE_BASE64 (base64 of the
# debug.keystore that signed the app on your phone), so each release installs as an update.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: brainrot-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Sign with the key of the app on the phone
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::Add DEBUG_KEYSTORE_BASE64 to the release environment"; exit 1; fi
          mkdir -p ~/.android && echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
      - run: ./gradlew test :app:assembleDebug
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "brainrot-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "brainrot-$GITHUB_REF_NAME.apk" --generate-notes
